<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B161C">
<meta name="description" content="Das Kampagnenbuch eurer Hollowmere-Runde: Charakterbögen, Gruppe, Karte, Chronik und Notizen.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kampagnenbuch">
<title>Hollowmere Kampagnenbuch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Marcellus&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Look: Laternennacht. One deliberate night theme: deep blue-black ground, slim Marcellus headings over light Outfit text,
   and five lantern colours with fixed jobs: amber = light, actions, proficiency; mint = hit points and healing;
   coral = combat and damage; violet = magic and locked things; sky = a calm extra tone.
   Layout: a sticky masthead (brand left, tabs right; a bottom bar on phones) over one working column up to 1120px. */
:root{
  --paper:#0E1B22; --paper-0:#0B161C; --paper-2:#142630; --paper-3:#0B161C; --raise:#1A303B; --note:#2A2618;
  --ink:#ECE8DC; --ink-soft:#9FB3B6; --rule:#2A4553; --shade:rgba(236,232,220,.06); --dim:#33415A;
  --amber:#F5B955; --flame:#F5B955; --coral:#FF8C7A; --danger:#FF8C7A; --mint:#6FE0C5; --moss:#6FE0C5; --violet:#B7A3FF; --plum:#B7A3FF; --sky:#7CC4FF;
  --t-amber:#2A2618; --t-coral:#2E2022; --t-mint:#11302F; --t-violet:#1E2145; --t-sky:#1B3146;
  --l-amber:#5E4E22; --l-mint:#23625A; --l-violet:#3D4486;
  --on-flame:#1A1408; --on-coral:#2A0F0A; --on-mint:#06241E; --focus:#F5B955;
  --display:"Marcellus","Cormorant Garamond",Georgia,serif;
  --text:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --script:"Cormorant Garamond",Georgia,serif;
  --r:16px;
  color-scheme:dark;
}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);font-weight:400;font-size:1rem;line-height:1.5;font-variant-numeric:lining-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:45;background:var(--paper-0)}
button,input,textarea,select{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
p{margin:0 0 .7rem}
i{font-style:normal}
b{font-weight:500}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.h1{font-size:clamp(1.9rem,5vw,2.75rem);line-height:1.06;letter-spacing:.01em}
.h2{font-size:1.4rem;line-height:1.2;margin:1.6rem 0 .5rem;letter-spacing:.02em}
.h3{font-size:1.2rem;line-height:1.2;letter-spacing:.02em}
.lead{color:var(--ink-soft);font-size:1.05rem;max-width:62ch;margin:.4rem 0 1.2rem}
.soft{color:var(--ink-soft)}
.sm{font-size:.9rem}
.lbl{font-size:.7rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 .3rem;display:block}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.empty{color:var(--ink-soft);padding:1rem 0;max-width:60ch}
.rowf{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto;min-width:0}
.right{margin-left:auto}
.stack{display:flex;flex-direction:column;gap:.9rem}

/* masthead */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--paper-0);border-bottom:1px solid var(--rule)}
.top>.wrap{display:flex;flex-wrap:wrap;align-items:center;gap:0 1.5rem}
.top-row{display:flex;align-items:center;gap:.9rem;min-height:60px;flex:1 1 auto;min-width:0}
.brand{display:flex;align-items:center;gap:.7rem;font-family:var(--display);font-size:1.4rem;line-height:1.05;letter-spacing:.02em;min-width:0}
.brand svg{width:22px;height:29px;flex:none}
.brand small{display:block;font-family:var(--text);font-size:.66rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin-top:.2rem}
.brand span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.savest{font-size:.8rem;color:var(--ink-soft);white-space:nowrap}
.acct{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--rule);background:var(--raise);padding:0;overflow:hidden}
.acct:hover{border-color:var(--amber)}
.acct img{width:100%;height:100%;object-fit:cover;display:block}
.login{max-width:27rem;margin:3rem auto 2rem;display:flex;flex-direction:column;gap:1rem}
.login .brand{font-size:2rem;gap:.8rem}
.login .brand svg{width:30px;height:39px}
.login .box{display:flex;flex-direction:column;gap:.75rem}
.or{display:flex;align-items:center;gap:.8rem;color:var(--ink-soft);font-size:.85rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--rule)}
.gbtn{justify-content:center;min-height:2.9rem;font-size:1rem}
.linkbtn{border:0;background:none;color:var(--amber);padding:0;font-size:.9rem;text-decoration:underline;text-underline-offset:3px}
.err{color:var(--coral);font-size:.92rem}
.ok{color:var(--mint);font-size:.92rem}
.copyrow{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:.45rem}
.copyrow code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.85rem;background:var(--paper-0);border:1px solid var(--rule);border-radius:10px;padding:.35rem .6rem;overflow-wrap:anywhere;user-select:all}
.tabs{display:flex;gap:.3rem;padding:.5rem 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;background:none;border:0;padding:.55rem 1.1rem;border-radius:999px;font-size:.97rem;letter-spacing:.02em;display:flex;align-items:center;gap:.45rem;white-space:nowrap;color:var(--ink)}
.tabs button:hover{color:var(--amber)}
.tabs button[aria-current="page"]{background:var(--amber);color:var(--on-flame);font-weight:500}
.tabs svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.badge{min-width:1.25rem;height:1.25rem;padding:0 .35rem;border-radius:999px;background:var(--coral);color:var(--on-coral);font-size:.74rem;font-weight:600;display:inline-grid;place-items:center;line-height:1}
main{padding-block:1.5rem 4rem}
@media (max-width:760px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--paper-0);border-top:1px solid var(--rule);justify-content:space-around;padding:.35rem max(.25rem,env(safe-area-inset-right,0px)) calc(.4rem + env(safe-area-inset-bottom,0px)) max(.25rem,env(safe-area-inset-left,0px));margin:0;max-width:none}
  .tabs button{flex-direction:column;gap:.1rem;font-size:.7rem;padding:.4rem .45rem;border-radius:14px;min-width:3.2rem}
  .tabs svg{width:22px;height:22px}
  .tabs .badge{position:absolute;top:.05rem;right:.15rem}
  main{padding-block:1.1rem 7rem}
}

/* controls */
.btn{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:.4rem 1.05rem;font-size:.95rem;white-space:nowrap;display:inline-flex;align-items:center;gap:.45rem;min-height:2.5rem;color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--amber);color:var(--amber)}
.btn.prime{border-color:var(--amber);color:var(--amber)}
.btn.solid,.btn.flame{background:var(--amber);border-color:var(--amber);color:var(--on-flame);font-weight:500}
.btn.solid:hover:not(:disabled),.btn.flame:hover:not(:disabled){background:#FFD08A;border-color:#FFD08A;color:var(--on-flame)}
.btn.quiet{color:var(--ink-soft)}
.btn.warn,.btn.dmg{border-color:var(--coral);color:var(--coral)}
.btn.warn:hover:not(:disabled),.btn.dmg:hover:not(:disabled){background:var(--coral);border-color:var(--coral);color:var(--on-coral)}
.btn.heal{border-color:var(--mint);color:var(--mint)}
.btn.heal:hover:not(:disabled){background:var(--mint);border-color:var(--mint);color:var(--on-mint)}
.btn:disabled{opacity:.45}
.btn.s{padding:.15rem .8rem;font-size:.86rem;min-height:2rem}
.btn svg,.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.xbtn{border:0;background:none;color:var(--ink-soft);padding:.2rem .45rem;border-radius:8px;font-size:1.2rem;line-height:1}
.xbtn:hover{color:var(--coral);background:var(--shade)}
.in{width:100%;padding:.45rem .8rem;border:1px solid var(--rule);border-radius:12px;background:var(--paper-3);min-height:2.5rem;color:var(--ink)}
.in:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(245,185,85,.2)}
.in::placeholder{color:var(--ink-soft);opacity:.7}
textarea.in{min-height:6rem;line-height:1.45;resize:vertical;display:block}
.in.num{width:4.6rem;text-align:center}
.in.tiny{width:3.5rem;text-align:center;padding:.25rem .2rem}
.fl{display:flex;flex-direction:column;gap:.2rem;min-width:0}
.fl>span{font-size:.8rem;color:var(--ink-soft)}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:.7rem .8rem}
.fg .wide{grid-column:1/-1}
.chk{display:inline-flex;align-items:center;gap:.5rem;cursor:pointer}
.chk input{width:1.1rem;height:1.1rem;accent-color:var(--amber)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;flex-wrap:wrap;background:var(--paper-0)}
.seg button{border:0;background:none;padding:.42rem .95rem;font-size:.92rem;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--amber);color:var(--on-flame);font-weight:500}
.chips{display:flex;gap:.4rem;flex-wrap:wrap}
.chip{border:1px solid var(--rule);border-radius:999px;background:transparent;padding:.28rem .9rem;font-size:.92rem;color:var(--ink)}
.chip:hover:not(:disabled){border-color:var(--amber)}
.chip[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--on-flame);font-weight:500}
.tag{display:inline-block;font-family:var(--text);font-size:.76rem;font-weight:400;border:1px solid var(--rule);border-radius:999px;padding:.05rem .6rem;color:var(--ink-soft);white-space:nowrap;line-height:1.5;letter-spacing:.03em;text-transform:none;vertical-align:middle}
.tag.new{background:var(--coral);border-color:var(--coral);color:var(--on-coral);font-weight:500}
.tag.you{background:var(--amber);border-color:var(--amber);color:var(--on-flame);font-weight:500}
.tag.ok,.tag.mint{border-color:var(--mint);color:var(--mint)}
.tag.bad{border-color:var(--coral);color:var(--coral)}
.tag.amber{border-color:var(--amber);color:var(--amber)}
.tag.violet{border-color:var(--violet);color:var(--violet)}
.tag.sky{border-color:var(--sky);color:var(--sky)}
.tag.big{font-size:.84rem;padding:.15rem .8rem}
.box{border:1px solid var(--rule);border-radius:20px;padding:1.15rem 1.25rem;background:var(--paper-2)}
.box.hp{background:var(--t-mint);border-color:var(--l-mint)}
.box.hp .lbl{color:var(--mint)}
.box.hp .in{border-color:var(--l-mint);border-radius:999px}
.hint{background:var(--paper-2);border:1px solid var(--rule);border-radius:var(--r);padding:.75rem 1rem;font-size:.95rem;max-width:74ch}
.subtabs{display:flex;gap:1.4rem;border-bottom:1px solid var(--rule);margin:1.4rem 0 1rem;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{background:none;border:0;border-bottom:2px solid transparent;padding:.5rem 0;font-family:var(--display);font-size:1.1rem;letter-spacing:.02em;color:var(--ink-soft);display:flex;gap:.4rem;align-items:center}
.subtabs button:hover{color:var(--ink)}
.subtabs button[aria-current="true"]{border-bottom-color:var(--amber);color:var(--ink)}

/* strips under the masthead */
.banner{background:var(--t-amber);border:1px solid var(--l-amber);border-radius:var(--r);padding:.7rem 1.1rem;margin:0 0 1rem}
.banner b{color:var(--amber)}
.cbar{display:flex;align-items:center;gap:.5rem 1rem;flex-wrap:wrap;border:1px solid var(--coral);border-radius:var(--r);background:var(--t-coral);padding:.7rem 1.1rem;margin:0 0 1rem}
.cbar>.ic{stroke:var(--coral);width:20px;height:20px}
div.cbar>span:first-of-type{color:var(--coral);font-weight:500;letter-spacing:.04em}
.cbar.mine{border-color:var(--amber);background:var(--t-amber);box-shadow:0 0 28px rgba(245,185,85,.25)}
.cbar.mine>.ic{stroke:var(--amber)}
div.cbar.mine>span:first-of-type{color:var(--amber)}
.cbar.plainbar{border-color:var(--rule);background:var(--paper-2)}
div.cbar.plainbar>span:first-of-type{color:var(--ink);font-weight:400;letter-spacing:0}
.cbar b{font-weight:500;font-size:1.05rem}
.cbar .in.num{width:4.4rem;border-radius:999px}

/* sheet */
.sh-head{display:flex;gap:1.25rem;align-items:center;flex-wrap:wrap}
.port{width:104px;aspect-ratio:4/5;flex:none;border:1.5px solid var(--amber);border-radius:20px;background:var(--raise);overflow:hidden;display:grid;place-items:center;font-family:var(--display);font-size:2.1rem;letter-spacing:.04em;color:var(--ink);position:relative;padding:0;box-shadow:0 0 32px rgba(245,185,85,.28)}
.port img{width:100%;height:100%;object-fit:cover;display:block}
.port.lg{width:100%;font-size:3rem;border-radius:0;border:0;border-bottom:1px solid var(--rule);box-shadow:none}
.port.lg.none{aspect-ratio:auto;height:5rem;font-size:2rem}
button.port:hover{box-shadow:0 0 42px rgba(245,185,85,.5)}
.port .cam{position:absolute;right:6px;bottom:6px;background:var(--amber);color:var(--on-flame);border-radius:999px;padding:.25rem;display:grid}
.sh-id{min-width:0;flex:1 1 16rem}
.idtags{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.65rem}
.sh-btns{display:flex;gap:.5rem;flex-wrap:wrap}
.vit{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.6rem;margin:1.25rem 0}
.vit.three{grid-template-columns:repeat(3,minmax(0,1fr));max-width:26rem}
@media (max-width:860px){.vit{grid-template-columns:repeat(4,minmax(0,1fr))}.vit>.hd{grid-column:span 2}.vit.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stat{border:1px solid var(--rule);border-radius:var(--r);text-align:center;padding:.8rem .35rem .75rem;background:var(--paper-2);line-height:1.2;min-width:0;color:var(--ink)}
.stat b{display:block;font-weight:400;font-size:1.85rem;line-height:1.25}
.stat small{display:block;font-size:.66rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.stat small:last-child{font-size:.75rem;font-weight:400;letter-spacing:0;text-transform:none}
.stat.on{border-color:var(--amber);background:var(--t-amber)}
button.stat{width:100%}
button.stat:hover{border-color:var(--amber)}
.vit>:nth-child(1) b{color:var(--amber)}
.vit>:nth-child(2) b{color:var(--coral)}
.vit>:nth-child(3) b{color:var(--sky)}
.vit>:nth-child(4) b{color:var(--violet)}
.vit>:nth-child(5) b{color:var(--mint)}
.vit>:nth-child(6) b{color:var(--amber)}
.vit>:nth-child(7) b{color:var(--ink-soft)}
.vit>.on:nth-child(7) b{color:var(--amber)}
.vit.three>div b{color:var(--violet)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:1.25rem;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.hp-nums{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap}
.hp-cur{font-weight:300;font-size:3.75rem;line-height:1}
.hp-max{font-size:1.15rem;color:#A9C9C3}
.hp-temp{font-size:.95rem;color:var(--sky);font-weight:500}
.bar{height:8px;border-radius:999px;background:var(--paper-0);overflow:hidden;margin:.75rem 0 1rem}
.bar i{display:block;height:100%;border-radius:999px;background:var(--mint);box-shadow:0 0 12px rgba(111,224,197,.7)}
.bar.low i{background:var(--amber);box-shadow:0 0 12px rgba(245,185,85,.7)}
.bar.out i{background:var(--coral);box-shadow:none}
.ds-row{display:flex;align-items:center;gap:.6rem;margin:.35rem 0;font-size:.95rem}
.ds-row span:first-child{width:5.8rem}
.abils{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem}
.abil{border:1px solid var(--rule);border-radius:var(--r);background:var(--paper-2);text-align:center;padding:.75rem .35rem .65rem;line-height:1.2;min-width:0}
.abil .n{display:block;font-size:.66rem;font-weight:500;color:var(--ink-soft);letter-spacing:.12em;text-transform:uppercase}
.abil .m{display:block;font-weight:400;font-size:2rem;margin:.1rem 0}
.abil .s{display:inline-block;color:var(--ink-soft);font-size:.85rem}
.abil .sv{display:flex;justify-content:center;align-items:center;gap:.35rem;font-size:.82rem;margin-top:.2rem;border:0;background:none;width:100%;padding:.15rem;color:var(--ink-soft)}
.abil.prof{border-color:var(--amber);background:var(--t-amber)}
.abil.prof .n,.abil.prof .sv{color:var(--amber)}
.dot{width:9px;height:9px;border-radius:50%;border:1px solid var(--ink-soft);flex:none;display:inline-block}
.dot.p{background:var(--amber);border-color:var(--amber)}
.dot.e{background:var(--violet);border-color:var(--violet);box-shadow:0 0 8px rgba(183,163,255,.75)}
.sklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:0 1.4rem}
.sk{display:flex;align-items:center;gap:.6rem;padding:.45rem .1rem;border:0;border-bottom:1px solid var(--rule);background:none;text-align:left;width:100%;color:var(--ink)}
.sk .ab{font-size:.66rem;letter-spacing:.1em;color:var(--ink-soft)}
.sk b{margin-left:auto}
button.sk:hover{background:var(--shade)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.3rem .8rem;align-items:center;padding:.75rem 0;border-bottom:1px solid var(--rule)}
.row .nm{font-weight:500}
.row .meta{color:var(--ink-soft);font-size:.9rem}
.hitb{display:inline-flex;gap:.45rem}
.hitb span{background:var(--t-coral);border-radius:12px;padding:.3rem .8rem;text-align:center;line-height:1.25;min-width:3.8rem;font-weight:500;color:var(--coral)}
.hitb span small{display:block;font-size:.68rem;font-weight:400;color:#C9B5B2}
.hitb span.dmg{background:var(--paper-0);color:var(--ink)}
.hitb span.dmg small{color:var(--ink-soft)}
.pips{display:inline-flex;gap:.4rem;flex-wrap:wrap;vertical-align:middle}
.pip{width:20px;height:20px;border-radius:50%;border:0;background:var(--amber);box-shadow:0 0 10px rgba(245,185,85,.7);padding:0}
.pip.used{background:var(--dim);box-shadow:none}
.pip.magic{background:var(--violet);box-shadow:0 0 10px rgba(183,163,255,.75)}
.pip.magic.used{background:var(--dim);box-shadow:none}
.pip.ok,.pip.bad{background:var(--dim);box-shadow:none}
.pip.ok.used{background:var(--mint);box-shadow:0 0 10px rgba(111,224,197,.7)}
.pip.bad.used{background:var(--coral);box-shadow:0 0 10px rgba(255,140,122,.7)}
.ctr{display:inline-flex;align-items:center;gap:.4rem}
.ctr b{font-size:1.4rem;font-weight:400;min-width:1.6ch;text-align:center}
.ctr .btn{padding:0;width:1.9rem;min-height:1.9rem;justify-content:center}
.edit-card{border:1px solid var(--rule);border-radius:var(--r);padding:.9rem 1rem;margin:.6rem 0;background:var(--paper-2)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:.3rem 1rem;margin:.4rem 0}
.kv dt{color:var(--ink-soft)}
.kv dd{margin:0;min-width:0}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:.8rem}
.pick{text-align:left;border:1px solid var(--rule);border-radius:20px;background:var(--paper-2);padding:1rem 1.15rem;display:flex;flex-direction:column;gap:.3rem;color:var(--ink)}
.pick:hover{border-color:var(--amber);box-shadow:0 0 24px rgba(245,185,85,.18)}
.pick b{font-family:var(--display);font-weight:400;font-size:1.3rem;line-height:1.15;letter-spacing:.01em}

/* party */
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:1rem}
.pcard{border:1px solid var(--rule);border-radius:20px;background:var(--paper-2);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pcard.me{border-color:var(--amber);box-shadow:0 0 28px rgba(245,185,85,.2)}
.pcard .body{padding:.85rem 1rem 1rem;display:flex;flex-direction:column;gap:.35rem;min-width:0}
.pcard h3{font-size:1.35rem;line-height:1.12;overflow-wrap:anywhere}
.pcard .bar{margin:.2rem 0 .1rem;height:5px}
.pcards>:nth-child(4n+1) .port.none{background:var(--t-coral);color:var(--coral)}
.pcards>:nth-child(4n+2) .port.none{background:var(--t-sky);color:var(--sky)}
.pcards>:nth-child(4n+3) .port.none{background:var(--t-violet);color:var(--violet)}
.pcards>:nth-child(4n+4) .port.none{background:var(--t-mint);color:var(--mint)}
@media (max-width:560px){.pcard{flex-direction:row}.pcard .port.lg{width:36%;aspect-ratio:auto;min-height:9.5rem;border-bottom:0;border-right:1px solid var(--rule)}.pcard .port.lg img{position:absolute;inset:0}.pcard .port.lg.none{width:4.2rem;height:auto;min-height:0}.pcard .body{flex:1 1 0}}
.who{display:flex;align-items:center;gap:.45rem;font-size:.85rem;color:var(--ink-soft);min-width:0}
.who img{width:20px;height:20px;border-radius:50%;flex:none}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lit{width:10px;height:10px;border-radius:50%;background:var(--dim);flex:none;display:inline-block}
.lit.on{background:var(--amber);box-shadow:0 0 10px rgba(245,185,85,.85)}
.order{list-style:none;margin:.4rem 0 0;padding:0}
.order li{display:flex;align-items:center;gap:.7rem;padding:.5rem .7rem;border:1px solid transparent;border-bottom-color:var(--rule)}
.order li.cur{background:var(--t-amber);border-color:var(--amber);border-radius:12px}
.order .i{font-weight:500;font-size:1.1rem;width:2ch;text-align:right;color:var(--coral)}

/* map (markers sit on the map picture, which is always light parchment) */
.mapscroll{overflow:auto;border:1px solid var(--rule);border-radius:20px;background:var(--paper-2);max-height:78vh;overscroll-behavior:contain}
.maplayer{position:relative;line-height:0}
.maplayer canvas{display:block;width:100%;height:auto}
.maplayer.wait{aspect-ratio:16/11;display:grid;place-items:center;line-height:1.4;color:var(--ink-soft)}
.pin{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;border:2px solid #0E1B22;background:#F5B955;color:#1A1408;font-weight:600;font-size:.85rem;line-height:1;display:grid;place-items:center;padding:0;box-shadow:0 1px 6px rgba(0,0,0,.45)}
.pin.sel{outline:3px solid #0E1B22;outline-offset:2px}
.pin.off{opacity:.5;border-style:dashed}
.here{position:absolute;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;border:3px solid #0E1B22;background:#F5B955;pointer-events:none;animation:halo 2.2s ease-in-out infinite}
@keyframes halo{0%,100%{box-shadow:0 0 0 5px rgba(245,185,85,.4)}50%{box-shadow:0 0 0 13px rgba(245,185,85,.12)}}
.ping{position:absolute;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;background:#FF8C7A;border:2px solid #0E1B22;pointer-events:none}
.ping::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:3px solid #FF8C7A;animation:ring 1s ease-out infinite}
.ping span{position:absolute;left:50%;top:26px;transform:translateX(-50%);white-space:nowrap;background:#0E1B22;color:#ECE8DC;border-radius:999px;padding:.1rem .6rem;font-size:.8rem;line-height:1.4}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(3.4);opacity:0}}
.lockb{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:.35rem;background:#0E1B22;color:#B7A3FF;border:1px solid #B7A3FF;border-radius:999px;padding:.35rem .8rem;font-size:.86rem;line-height:1.2;white-space:nowrap;max-width:60%}
.lockb span{overflow:hidden;text-overflow:ellipsis}
.lockb:hover{background:#1E2145}
.maptools{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.7rem 0}
.map-layout{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(240px,1fr);gap:1.25rem;align-items:start}
@media (max-width:900px){.map-layout{grid-template-columns:1fr}}
.place{border:1px solid var(--rule);border-radius:var(--r);background:var(--paper-2);padding:1rem 1.1rem}
.edcanvas{cursor:crosshair}

/* chronicle */
.entry{max-width:66ch;padding:1.1rem 0;border-bottom:1px solid var(--rule)}
.entry h2{font-size:1.6rem;line-height:1.15;margin:0 0 .2rem}
.entry .sub{color:var(--ink-soft);margin:0 0 .5rem}
.entry img,.handout img,.npc img{border-radius:12px;border:1px solid var(--rule);margin:.4rem 0;display:block;max-width:100%}
.handouts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:1.2rem;margin-top:.6rem}
.handout{background:var(--t-amber);border:1px solid var(--l-amber);padding:1.1rem 1.25rem 1rem;border-radius:20px;min-width:0}
.handout h3{font-family:var(--text);font-size:.7rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin:0 0 .5rem}
.handout .txt{font-family:var(--script);font-style:italic;font-weight:500;font-size:1.4rem;line-height:1.3}
.sealed{border:1px dashed var(--violet);border-radius:20px;padding:1rem 1.15rem;background:var(--t-violet);max-width:66ch;margin:.8rem 0}
.sealed h3{display:flex;align-items:center;gap:.5rem;font-size:1.25rem}
.sealed h3 .ic{stroke:var(--violet);width:18px;height:18px}
.npcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:1rem}
.npc{border:1px solid var(--rule);border-radius:20px;background:var(--paper-2);padding:.9rem 1rem;min-width:0}
.npc h3{font-size:1.3rem}
.priv{border:1px solid var(--violet);border-radius:var(--r);background:var(--t-violet);margin:.6rem 0;max-width:66ch}
.priv>button{display:flex;gap:.6rem;align-items:center;width:100%;text-align:left;border:0;background:none;padding:.8rem 1rem;font-family:var(--display);font-size:1.15rem;letter-spacing:.02em;color:var(--ink)}
.priv>button .ic{stroke:var(--violet)}
.priv .in-body{padding:0 1rem 1rem}
.pwbox{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;max-width:30rem}
.pwbox .in{flex:1 1 10rem;width:auto;border-radius:999px}

/* notes */
.board-item{border-bottom:1px solid var(--rule);padding:.7rem 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.2rem .6rem}
.sheetcheat h3{margin:1.3rem 0 .3rem;color:var(--amber)}
.sheetcheat ul{margin:.2rem 0 .6rem;padding-left:1.1rem;max-width:72ch}
.sheetcheat li{margin:.2rem 0}

/* game master */
.gm-row{display:flex;align-items:center;gap:.6rem;padding:.55rem 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.gm-row .t{flex:1 1 12rem;min-width:0;border:0;background:none;text-align:left;padding:.1rem 0;font-weight:500;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.gm-row .t:hover{color:var(--amber)}
table.roster{border-collapse:collapse;width:100%;min-width:620px}
table.roster th{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);font-weight:500;text-align:left;padding:.3rem .6rem .45rem 0;border-bottom:1px solid var(--rule)}
table.roster td{padding:.55rem .6rem .55rem 0;border-bottom:1px solid var(--rule);vertical-align:middle}
.scrollx{overflow-x:auto}
.steps{counter-reset:s;list-style:none;padding:0;margin:.6rem 0;max-width:66ch}
.steps li{counter-increment:s;display:grid;grid-template-columns:2rem minmax(0,1fr);gap:.2rem .6rem;padding:.75rem 0;border-bottom:1px solid var(--rule)}
.steps li::before{content:counter(s);font-family:var(--display);font-size:1.5rem;line-height:1.15;color:var(--amber)}

/* overlays */
.modal{position:fixed;inset:0;z-index:70;background:rgba(5,10,14,.72);display:grid;place-items:center;padding:calc(1rem + env(safe-area-inset-top,0px)) max(1rem,env(safe-area-inset-right,0px)) calc(1rem + env(safe-area-inset-bottom,0px)) max(1rem,env(safe-area-inset-left,0px));overflow:auto}
.modal>div{background:var(--paper-2);border:1px solid var(--rule);border-radius:24px;padding:1.3rem 1.4rem 1.4rem;width:min(34rem,100%);max-height:100%;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.modal .box{background:var(--paper);border-radius:var(--r)}
.toasts{position:fixed;right:max(1rem,env(safe-area-inset-right,0px));bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;gap:.5rem;width:min(360px,calc(100vw - 2rem))}
@media (max-width:760px){.toasts{left:max(1rem,env(safe-area-inset-left,0px));right:max(1rem,env(safe-area-inset-right,0px));width:auto;bottom:calc(5.4rem + env(safe-area-inset-bottom,0px))}}
.toast{background:var(--ink);color:#12202A;font-weight:500;border-radius:14px;padding:.75rem 1.05rem;box-shadow:0 10px 28px rgba(0,0,0,.5)}
.toast.err{background:var(--coral);color:var(--on-coral)}
.boot{padding:2.5rem 0}
.boot .h1{margin-bottom:.4rem}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
